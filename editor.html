<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Liturgy Editor</title>
<style>
:root {
  --bg: #f4efe6; --panel: #fffdf8; --ink: #2a2522; --ink-2: #5d554e; --ink-3: #8b8178; --line: #e3d9ca; --line-2: #d2c5b2;
  --red: #8c1a1f; --red-soft: #f6e7e5; --gold: #9a7420; --green: #2f6b3a; --blue: #2c5d8a; --warn: #a35a00;
  --sel: #efe4d2; --shadow: 0 1px 2px rgba(60,40,20,.08), 0 2px 8px rgba(60,40,20,.06);
  --r: 8px; --fs: 15px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1a18; --panel: #262220; --ink: #ece5dc; --ink-2: #bdb3a8; --ink-3: #8f857b; --line: #3a3430; --line-2: #4a423c;
    --red: #e0686c; --red-soft: #3a2424; --gold: #d0a64a; --green: #7fbf8a; --blue: #8ab8e0; --warn: #e0a050; --sel: #332d28;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: var(--fs)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--ink-3); }
button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
button.primary:disabled { opacity: .45; cursor: default; }
button.ghost { border-color: transparent; background: transparent; }
button.ghost:hover { background: var(--sel); }
button.sm { padding: 2px 7px; font-size: .86em; }
button.danger { color: var(--red); }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=url], input[type=password], select, textarea {
  width: 100%; border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 8px; background: var(--bg);
}
textarea { resize: vertical; min-height: 2.4em; line-height: 1.45; }
input:focus, select:focus, textarea:focus, [contenteditable]:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
a { color: var(--red); }
.muted { color: var(--ink-3); }
.small { font-size: .85em; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top .brand { font-weight: 700; letter-spacing: .02em; }
.top select { width: auto; max-width: 280px; }
#status { font-size: .88em; color: var(--ink-2); flex: 1; min-width: 120px; }
#status.dirty { color: var(--warn); font-weight: 600; }
#status.err { color: var(--red); font-weight: 600; }
#status.ok { color: var(--green); }
.top .acts { display: flex; gap: 6px; flex-wrap: wrap; }

/* layout */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - var(--toph, 52px)); }
.layout.pv { grid-template-columns: 250px minmax(0, 1fr) minmax(360px, 42%); }
aside#days { border-right: 1px solid var(--line); padding: 10px; position: sticky; top: var(--toph, 52px); align-self: start; max-height: calc(100vh - var(--toph, 52px)); overflow: auto; }
aside#days .dayitem { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; margin: 1px 0; }
aside#days .dayitem:hover { background: var(--sel); }
aside#days .dayitem.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--red); }
aside#days .dayitem .d { font-weight: 600; font-size: .9em; display: flex; align-items: center; gap: 6px; }
aside#days .dayitem .t { font-size: .82em; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
aside#days .grp { font-size: .72em; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 12px 8px 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.2); flex: none; }
.c-green { background: #3d7a46; } .c-white { background: #fff; } .c-red { background: #b3262c; } .c-violet { background: #6b3d8f; } .c-rose { background: #d98ca8; } .c-black { background: #222; } .c-gold { background: #c9a227; }
main#main { padding: 14px 18px 120px; min-width: 0; }
section#preview { border-left: 1px solid var(--line); position: sticky; top: var(--toph, 52px); height: calc(100vh - var(--toph, 52px)); display: flex; flex-direction: column; background: var(--panel); }
section#preview .pvbar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: .88em; flex-wrap: wrap; }
section#preview[hidden] { display: none !important; }
section#preview iframe { flex: 1; width: 100%; border: 0; background: #fff; }
.mobile-days, .mobile-days.row { display: none; margin-bottom: 10px; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 12px; }
.card h2 { font-size: 1.08em; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h2 .sp { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; }
.grid .wide { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld > span { font-size: .78em; color: var(--ink-2); font-weight: 600; letter-spacing: .01em; }
.fld .hint { font-size: .76em; color: var(--ink-3); font-weight: 400; }
.chk { display: flex; align-items: center; gap: 6px; font-size: .9em; }
.chk input { width: auto; }
.grid > .chk { grid-column: 1 / -1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; }
details.more > summary { cursor: pointer; color: var(--ink-2); font-size: .86em; margin-top: 6px; }

/* items (celebrations) */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 10px; }
.tabs button { border-radius: 999px; }
.tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* blocks */
.bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0 10px; position: sticky; top: var(--toph, 52px); z-index: 5; background: var(--bg); padding: 6px 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button.on { background: var(--ink); color: var(--panel); }
.sec { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-bottom: 8px; box-shadow: var(--shadow); }
.sec > .sh { display: flex; align-items: center; gap: 6px; padding: 7px 10px; cursor: pointer; user-select: none; }
.sec > .sh .tt { font-weight: 650; flex: 1; min-width: 0; }
.sec > .sh .n { font-size: .78em; color: var(--ink-3); }
.sec > .sh .caret { width: 14px; color: var(--ink-3); }
.sec.closed > .sb { display: none; }
.sec > .sb { border-top: 1px solid var(--line); padding: 6px; }
.blk { border-radius: 6px; margin: 2px 0; }
.blk > .bh { display: flex; gap: 8px; align-items: flex-start; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
.blk > .bh:hover { background: var(--sel); }
.blk.open { background: var(--bg); outline: 1px solid var(--line-2); }
.blk.open > .bh { background: var(--sel); }
.kind { flex: none; font-size: .7em; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; background: var(--sel); color: var(--ink-2); margin-top: 2px; white-space: nowrap; }
.kind.k-h { background: var(--ink); color: var(--panel); }
.kind.k-r { background: var(--red-soft); color: var(--red); }
.kind.k-song, .kind.k-music { background: #e9e0f3; color: #5a3d7a; }
.kind.k-lect, .kind.k-tbaread, .kind.k-alh, .kind.k-alv { background: #e2ecf5; color: var(--blue); }
.kind.k-slot, .kind.k-ant, .kind.proper { background: #f3ead2; color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kind.k-song, :root:not([data-theme="light"]) .kind.k-music { background: #3a3046; color: #cbb3e6; } :root:not([data-theme="light"]) .kind.k-lect, :root:not([data-theme="light"]) .kind.k-tbaread, :root:not([data-theme="light"]) .kind.k-alh, :root:not([data-theme="light"]) .kind.k-alv { background: #263646; } :root:not([data-theme="light"]) .kind.k-slot, :root:not([data-theme="light"]) .kind.k-ant, :root:not([data-theme="light"]) .kind.proper { background: #3a3220; } }
.sum { flex: 1; min-width: 0; font-size: .92em; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: pre-line; }
.sum.r { color: var(--red); font-style: italic; }
.sum .tba { color: var(--warn); font-weight: 600; }
.flags { font-size: .72em; color: var(--ink-3); white-space: nowrap; margin-top: 3px; }
.btools { display: none; gap: 2px; flex: none; }
.blk > .bh:hover .btools, .blk.open .btools { display: flex; }
.bf { padding: 6px 10px 12px 10px; }
.ins { display: flex; justify-content: center; height: 0; position: relative; }
.lines-ed .ln { display: grid; grid-template-columns: 150px 1fr auto; gap: 6px; margin-bottom: 6px; align-items: start; }
.chunks-ed .ch { display: grid; grid-template-columns: 70px 1fr 1fr auto; gap: 6px; margin-bottom: 6px; }
.rich { border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; background: #fff; color: #222; min-height: 4em; font-family: Georgia, serif; }
.rich .ant, .rich .m { color: #8c1a1f; } .rich .rubric, .rich .epi { color: #8c1a1f; font-style: italic; }
.rich p { margin: 0 0 .5em; white-space: pre-line; }
.quick .qh { font-size: .74em; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 16px 2px 4px; font-weight: 700; }
.quick .blk { background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; box-shadow: var(--shadow); }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-2); }
.pill { font-size: .72em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.pill.warn { border-color: var(--warn); color: var(--warn); }

dialog { border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 0; max-width: min(680px, 94vw); width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(30,20,10,.35); }
dialog .dh { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; align-items: center; }
dialog .dh .sp { flex: 1; }
dialog .db { padding: 14px 16px; max-height: 70vh; overflow: auto; }
dialog .df { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.palette button { text-align: left; padding: 8px 10px; }
.palette button b { display: block; font-size: .92em; }
.palette button span { display: block; font-size: .78em; color: var(--ink-3); }
ol.steps { padding-left: 20px; } ol.steps li { margin-bottom: 6px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px; z-index: 50; box-shadow: var(--shadow); max-width: 90vw; }

@media (max-width: 900px) {
  .layout, .layout.pv { grid-template-columns: minmax(0, 1fr); }
  aside#days { display: none; }
  .mobile-days, .mobile-days.row { display: flex; }
  section#preview { position: fixed; inset: var(--toph, 52px) 0 0 0; z-index: 30; height: auto; }
  main#main { padding: 10px 10px 120px; }
  .lines-ed .ln { grid-template-columns: 1fr; }
  .chunks-ed .ch { grid-template-columns: 1fr; }
  .btools { display: flex; }
  .top .brand { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <span class="brand">✠ Editor</span>
  <select id="site" aria-label="Trang web"></select>
  <span id="status">Đang tải…</span>
  <div class="acts">
    <button id="b-preview" type="button">Xem trước</button>
    <button id="b-save" class="primary" type="button" disabled>Lưu lên web</button>
    <button id="b-menu" type="button" aria-label="Thêm">⋯</button>
  </div>
</header>
<div class="layout" id="layout">
  <aside id="days"></aside>
  <main id="main"><div class="empty">Đang tải dữ liệu…</div></main>
  <section id="preview" hidden>
    <div class="pvbar">
      <select id="pv-page" style="width:auto"></select>
      <button id="pv-reload" class="sm" type="button">Làm mới</button>
      <span class="muted small" style="flex:1">Bản xem trước (chưa lưu lên web)</span>
      <button id="pv-close" class="sm" type="button">Đóng ✕</button>
    </div>
    <iframe id="pv" title="Xem trước"></iframe>
  </section>
</div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ======================================================================
   Liturgy Editor — edits the content file of a liturgy site (days -> items -> blocks)
   and saves it to GitHub. One file for all the sites below; no build step, no library.
   ====================================================================== */
const SITES = [
  { id: "english-mass", name: "English Mass · St. Joseph Convent", owner: "cantate-domino", repo: "english-mass", branch: "main",
    data: "mass-data.js", base: "https://cantate-domino.github.io/english-mass/", sheets: "sheets/",
    pages: [["index.html", "Bản văn Thánh lễ"], ["songs.html", "Trang tập hát"]], kinds: ["mass"], songsOnly: true }
  /* Another site can be added here (same content format). APDFLC 2026 (apdflc.github.io) is frozen since 05/11/2026: not edited. */
];
const KIND_NAMES = { mass: "Thánh lễ", lauds: "Kinh Sáng", midday: "Kinh Trưa", vespers: "Kinh Chiều", compline: "Kinh Tối", frame: "Khác" };
const COLORS = [["green", "Xanh"], ["white", "Trắng"], ["red", "Đỏ"], ["violet", "Tím"], ["rose", "Hồng"], ["black", "Đen"]];
const WHO = [["P", "Linh mục (Priest)"], ["D", "Phó tế (Deacon)"], ["A", "Mọi người (All)"], ["R", "Cộng đoàn đáp ℟"], ["V", "Câu xướng ℣"], ["L", "Người đọc (Reader)"]];
const READ_KINDS = [["first", "Bài đọc 1"], ["psalm", "Đáp ca"], ["second", "Bài đọc 2"], ["gospel", "Tin Mừng"]];
const SONG_PARTS = { entrance: ["Entrance Chant", "Ca Nhập lễ"], offertory: ["Offertory Chant", "Ca Dâng lễ"], communion: ["Communion Chant", "Ca Hiệp lễ"], recessional: ["Recessional", "Kết lễ"] };
const MASS_PARTS = [["kyrie", "Kyrie"], ["gloria", "Gloria"], ["alleluia", "Alleluia"], ["holy", "Sanctus (Holy)"], ["mystery", "Mầu nhiệm đức tin"], ["amen", "Amen"], ["lamb", "Agnus Dei"]];
const K = {   // block kinds: name, short description, template for a new one
  h:       ["Tiêu đề phần", "Đầu một phần lớn (có trong mục lục)", () => ({ k: "h", en: "New section", vi: "", id: "sec-" + Date.now().toString(36) })],
  sub:     ["Tiêu đề nhỏ", "Tên một nghi thức trong phần", () => ({ k: "sub", en: "", vi: "" })],
  r:       ["Chỉ dẫn (chữ đỏ)", "Rubric: hướng dẫn nghi thức", () => ({ k: "r", en: "", vi: "" })],
  v:       ["Lời đọc / đối đáp", "Linh mục, cộng đoàn, mọi người…", () => ({ k: "v", lines: [["P", ""]] })],
  lect:    ["Bài đọc", "Bài đọc, đáp ca, Tin Mừng có bản văn", () => ({ k: "lect", kind: "first", cite: "", lang: "EN", incipit_en: "", chunks: [["", "", ""]] })],
  tbaread: ["Bài đọc chưa có bản văn", "Hiện “Text to be added”", () => ({ k: "tbaread", kind: "first", cite: "" })],
  song:    ["Bài hát", "Nhập lễ, Dâng lễ, Hiệp lễ, Kết lễ", () => ({ k: "song", part: "entrance", partEn: "Entrance Chant", partVi: "Ca Nhập lễ", title: "", by: "", no: "", pdf: null, lyrics: "" })],
  music:   ["Bản nhạc bộ lễ", "Kyrie, Gloria, Sanctus… (ảnh bản nhạc + YouTube)", () => ({ k: "music", pdf: { title: "", part: "kyrie", sheet: "" } })],
  alh:     ["Tung hô Tin Mừng", "Thẻ “Alleluia” với trích dẫn", () => ({ k: "alh", cite: "" })],
  alv:     ["Câu Alleluia", "Câu xướng trước Tin Mừng", () => ({ k: "alv", text: "", sung: false })],
  ant:     ["Ca tiền xướng", "Ca nhập lễ / Ca hiệp lễ (Sách lễ)", () => ({ k: "ant", text: "", cite: "", proper: true })],
  slot:    ["Lời nguyện riêng", "Lời nguyện của ngày (có thể để trống)", () => ({ k: "slot", who: "P", en: "Prayer of the day", vi: "" })],
  audio:   ["Ghi âm bài đọc", "Nút nghe (SoundCloud, USCCB)", () => ({ k: "audio", id: "" })],
  lat:     ["Bản Latinh", "Kinh Latinh (Salve, O lumen…)", () => ({ k: "lat", title: "", text: "", en: "", vi: "" })],
  html:    ["Đoạn văn định dạng", "Bản văn Giờ kinh (thánh vịnh, tiền xướng…)", () => ({ k: "html", html: "<p class=\"tx\"></p>", sec: "" })],
  quote:   ["Trích dẫn", "Câu trích có nguồn", () => ({ k: "quote", text: "", cite: "" })],
  book:    ["Ghi chú", "Dòng ghi chú nhỏ", () => ({ k: "book", en: "", vi: "" })],
  epsel:   ["Nút chọn KNTT II | III", "Đặt ở đầu Kinh nguyện Thánh Thể", () => ({ k: "epsel" })],
  pasel:   ["Nút chọn mẫu Sám hối", "Đặt ở đầu nghi thức Sám hối", () => ({ k: "pasel" })],
  tba:     ["Chưa có bản văn", "Dòng “Text to be added”", () => ({ k: "tba" })],
  ps:      ["Danh sách thánh vịnh", "", null], pf: ["Lời nguyện tín hữu", "", null], hymn: ["Thánh thi (có nhạc)", "", null],
  score:   ["Bản nhạc", "", null], scorefold: ["Bản nhạc (gập)", "", null], chant: ["Bình ca", "", null], read: ["Thẻ bài đọc", "", null]
};
const KEY_KINDS = new Set(["song", "music", "lect", "tbaread", "alh", "alv", "slot", "audio", "pf"]);   // "the parts changed each time"
const isKey = b => KEY_KINDS.has(b.k) || ((b.k === "v" || b.k === "ant") && b.proper);

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
function toast(msg, ms = 2600) { const t = h("div", { class: "toast", text: msg }); document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function nowVN() { return new Date(Date.now() + 7 * 36e5); }
function stampVN() {
  const d = nowVN(), M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getUTCDate() + " " + M[d.getUTCMonth()] + " " + d.getUTCFullYear() + ", " + String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0") + " (UTC+7)";
}
const todayVN = () => nowVN().toISOString().slice(0, 10);
const WD_VI = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
function dayLabel(iso) { const [y, m, d] = iso.split("-").map(Number); return WD_VI[new Date(Date.UTC(y, m - 1, d)).getUTCDay()] + " " + String(d).padStart(2, "0") + "/" + String(m).padStart(2, "0") + "/" + y; }
const slug = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);

    const it = curD && curD.items && curD.items[curI];
    const hash = !curD ? "" : SITE.id === "english-mass" ? curD.date : it ? "s-" + (it.id || ("d" + curD.date.replace(/-/g, "") + "-" + (it.kind || "mass"))) + "-top" : "";
    let html = pvHTML[url].replace(/document\.write\('<script src="[\w-]+-data\.js[^;]*\);/, "");
    html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + baseOf(SITE) + '"><script>' + (hash ? 'try{location.hash=' + JSON.stringify(hash) + '}catch(e){}' : "") + '<\/script>');
    const f = $("pv"), y = f.contentWindow ? f.contentWindow.scrollY : 0, same = f.dataset.page === page + "|" + hash;
    f.dataset.page = page + "|" + hash;
    f.onload = () => { if (same && y) try { f.contentWindow.scrollTo(0, y); } catch (e) {} };
    f.srcdoc = html;
  } catch (e) { $("pv").srcdoc = "<p style='font:15px system-ui;padding:20px'>Không mở được trang để xem trước (" + url + ": " + e.message + ").<br>Trang này cần được đưa lên web trước.</p>"; }
}

/* ---------- start ---------- */
function initSites() {
  const s = $("site");
  s.append(...SITES.map(x => h("option", { value: x.id, text: x.name })));
  const want = params.get("site") || (SITES.find(x => location.href.startsWith(x.base)) || SITES[0]).id;
  SITE = SITES.find(x => x.id === want) || SITES[0]; s.value = SITE.id;
  s.onchange = async () => {
    if (dirty && !await ask("Đổi trang", "Thay đổi chưa lưu của trang này vẫn được giữ làm bản nháp trong trình duyệt. Đổi trang?", "Đổi", "Huỷ")) { s.value = SITE.id; return; }
    SITE = SITES.find(x => x.id === s.value); curD = null; pvPage = null; fillPvPages(); $("pv").srcdoc = ""; load();
  };
  fillPvPages();
}
function fillPvPages() { const p = $("pv-page"); p.textContent = ""; p.append(...SITE.pages.map(([f, n]) => h("option", { value: f, text: n }))); p.onchange = () => { pvPage = p.value; preview(); }; }
$("b-save").onclick = save;
$("b-menu").onclick = menu;
$("b-preview").onclick = () => { if ($("preview").hidden) preview(); else { $("preview").hidden = true; $("layout").classList.remove("pv"); } };
$("pv-close").onclick = () => { $("preview").hidden = true; $("layout").classList.remove("pv"); };
$("pv-reload").onclick = () => { pvHTML = {}; preview(); };
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (dirty) save(); } });
new ResizeObserver(() => document.documentElement.style.setProperty("--toph", document.querySelector(".top").offsetHeight + "px")).observe(document.querySelector(".top"));
initSites(); load();
</script>
